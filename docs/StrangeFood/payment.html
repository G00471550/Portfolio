<!DOCTYPE html>


<html>

	<head>
		<meta charset="UTF-8">
		<title>Strangest Food in the World - Payment</title>
		<style>
			@import url(/css/style.css);
		</style>
		<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&family=Open+Sans&display=swap" rel="stylesheet">
	</head>
	
	
	<body>
		<div id="page">

			<div class="toppage">
			
				<div id="logo">
					<img src="logo.png" alt="Strange food">
				</div>

				<nav>
					<a href="index.html" id="home">HOME</a>
					<a href="FOOD.html" id="food">FOOD</a>
					<a href="BUY.html" id="buy">BUY</a>
					<a href="CONTACT.html" id="contact">CONTACT</a>
				</nav>
				
			</div>

			
			
			<div class="pay">
			
				<form action="http://www.example.com/reviev.php" method="get" id="payform">
			  
					<h2>Add Payment Method</h2>

					<p class="pfn">
					
						First Name <span class="star">*</span><br>
						<input type="text" name="firstname" maxlength="100" placeholder="Enter first name" required>
					
					</p>

					<p class="pln">
					
						Last Name <span class="star">*</span><br>
						<input type="text" name="lastname" maxlength="100" placeholder="Enter last name" required>
					
					</p>

					<p class="padd">
					
						Address <span class="star">*</span><br>
						<input type="text" name="address" maxlength="100" placeholder="Enter address" required>
					  
					</p>

					<p class="pcon">
					
						Country <span class="star">*</span><br>
						<input type="text" name="country" maxlength="100" placeholder="Enter country" required>
					  
					</p>

					<p class="pema">
					
						Email <span class="star">*</span><br>
						<input type="email" name="email" maxlength="100" placeholder="Enter email" required>
					  
					</p>

					<p class="ppn">
					
						Phone Number <span class="star">*</span><br>
						<input type="text" name="phone" maxlength="100" placeholder="Enter phone number" required>
					  
					</p>
					

					<p class="cardnum-full">
					
						Credit Card Number <span class="star">*</span><br>
						<input type="text" name="cardnumber" maxlength="19" placeholder="1234 5678 9012 3456" required>
					  
					</p>

					<div class="card-details-row">
						
						<div class="cardtype">
							
							<p>Credit Card Type <span class="star">*</span></p>
							
							<div class="card-options">
							
								<label><input type="radio" name="cardtype" value="visa" required>Visa</label>
								<label><input type="radio" name="cardtype" value="visa_debit">Visa Debit</label>
								<label><input type="radio" name="cardtype" value="mastercard">Mastercard</label>
								<label><input type="radio" name="cardtype" value="amex">American Express</label>
								
							</div>
							
						</div>

						<div class="exprdate">
							
							<p>Expiration Date <span class="star">*</span></p>
							
							<div class="date-select">
							
								<select name="month" required>
								
									<option value="">Month</option>
									<option>01</option><option>02</option><option>03</option><option>04</option>
									<option>05</option><option>06</option><option>07</option><option>08</option>
									<option>09</option><option>10</option><option>11</option><option>12</option>
									
								</select>

								<select name="year" required>
								
									<option value="">Year</option>
									<option>2025</option><option>2026</option><option>2027</option>
									<option>2028</option><option>2029</option><option>2030</option>
									
								</select>
								
							</div>
							
						</div>
						
					</div>

					<input type="submit" value="Add Payment Method">
					
				</form>
			  
			</div>

		</div>
		
	</body>
	
</html>
