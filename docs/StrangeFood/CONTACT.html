<!DOCTYPE html>


<html>
	
	<head>
		
		<title>Strangest food in a world</title>
		
		<style>
			@import url(../css/style.css);
		</style>
		
		<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600&family=Open+Sans&display=swap" rel="stylesheet">
	
	</head>
	
	
	<body>

		<div id="page">
			
			<div class="toppage">
				
				<div id="logo">
					<img src="logo.png" alt="Strange food" />
				</div>
		
				<nav>
					<a href="index.html" id="home">HOME</a>
					<a href="FOOD.html" id="food">FOOD</a>
					<a href="BUY.html" id="buy">BUY</a>
					<a href="CONTACT.html" id="contact">CONTACT</a>
				</nav>
				
			</div>


			<div class="form-contact">
			
				<form action="http://www.example.com/reviev.php" method="get" id="contactform">
		
					<h2>Contact us</h2>

						<div id="name">
						
							<label for="firstname">First name</label>
							<input type="text" name="firstname" id="firstname" placeholder="Enter first name here" required />
							
						</div>
						
						
						<div id="surename">
						
							<label for="lastname">Last name</label>
							<input type="text" name="lastname" id="lastname" placeholder="Enter last name here" required />
							
						</div>
						
						
						<div id="email">
						
							<label for="email">Email</label>
							<input type="email" name="email" id="email" placeholder="Enter your email here" required />
							
						</div>
						
						
						<div id="date">
						
							<label for="DoB">Date of birth</label>
							<input type="date" name="DoB" id="DoB" required />
							
						</div>
						
						
						<div id="comment">
						
							<label for="comments">Comment</label>
							<textarea name="comments" id="comments" rows="10" cols="50" placeholder="Enter your comment here..." required></textarea>
							
						</div>
						
						
						<div id="policy">
						
							<label for="subscribe">
								<input type="checkbox" name="subscribe" id="subscribe" required />
								I HAVE READ THE <a href="Policy.pdf">USER POLICY</a>
							</label>
							
						</div>
						
						
						<div id="submit">
						
							<input type="submit" value="Contact" />
							
						</div>
					
				</form>
				
			</div>
			
		</div>

	</body>
	
</html>
