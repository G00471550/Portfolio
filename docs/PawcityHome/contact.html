        <nav class="navbar navbar-expand-lg bg-body-tertiary " data-bs-theme="dark">

        <h1 class="mt-3">Adoption Form</h1>
        <p>If you are interested in adopting, please fill out the application below:</p>

        <form>

            <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="username" aria-describedby="emailHelp" placeholder="Enter your full name" required>
            </div>

            <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">Email address</label>
                <input type="email" class="form-control" id="useremail" aria-describedby="emailHelp" placeholder="Email@example.com" required>
            </div>

            <div class="mb-3">
                <label for="exampleInputPassword1" class="form-label">Why do you want to adopt?</label>
                <textarea class="form-control" placeholder="Tell us about your home and lifestyle" id="floatingTextarea"></textarea>
            </div>

            <button type="submit" class="btn btn-primary " id="loginBtn">Submit Application</button>
        </form>


        <div class="applicationrec" hidden>
            <p id="name"></p>
            <p id="email"></p>
            <p id="reason"></p>
        </div>


    </body>
</html>
